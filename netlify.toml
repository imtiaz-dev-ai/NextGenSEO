[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "index, follow"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cache-Control = "public, max-age=0, must-revalidate"
    X-DNS-Prefetch-Control = "on"
    Accept-Ranges = "bytes"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/pics/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Self-hosted fonts — cache hard, they never change without a filename bump
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service worker must never be cached, or clients get stuck on an old version
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# 1. http/non-www → https/www
[[redirects]]
  from = "http://nextgenseo.pro/*"
  to = "https://www.nextgenseo.pro/:splat"
  status = 301
  force = true

# 2. https/non-www → https/www
[[redirects]]
  from = "https://nextgenseo.pro/*"
  to = "https://www.nextgenseo.pro/:splat"
  status = 301
  force = true

# 3. http/www → https/www
[[redirects]]
  from = "http://www.nextgenseo.pro/*"
  to = "https://www.nextgenseo.pro/:splat"
  status = 301
  force = true

# 4. marketplace → buy-backlinks
[[redirects]]
  from = "/marketplace"
  to = "/buy-backlinks"
  status = 301
  force = true

# 5. Remove trailing slash (except root /)
[[redirects]]
  from = "/:path/"
  to = "/:path"
  status = 301
  force = true

# 6. SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = false

[build.processing.images]
  compress = true
